name: Weekly Collect

on:
  schedule:
    # 每周一 09:00 UTC+8 = 01:00 UTC
    - cron: "0 1 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run brand collection
        run: python run_collect.py

      - name: Build scorecard
        run: python scorecard.py

      - name: Commit derived CSVs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scorecard.csv
          if git diff --staged --quiet; then
            echo "No CSV changes to commit"
          else
            git commit -m "chore: weekly data refresh [skip ci]"
            git push
          fi
