name: Weekly Collect

on:
  schedule:
    # 每周一 09:00 UTC+8 = 01:00 UTC
    - cron: "0 1 * * 1"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}   # Supabase 连接串(仓库 Secrets 配置)

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Guard — DATABASE_URL must be set
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret 未配置。仓库 Settings → Secrets → Actions 添加。"
            exit 1
          fi

      - name: Run brand collection
        run: python run_collect.py

      - name: Build scorecard
        run: python scorecard.py

      - name: Discover + universe funnel
        run: |
          python discovery.py
          python scripts/universe.py
        # 数据全部落 Supabase(持久化),runner 无需 commit 任何文件
